<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ADDICT-DO">
<meta name="description" content="ADDICT-DO - the to-do list you can't put down. Take your tablets.">
<title>ADDICT-DO</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#0e0e13; --card:#181822; --card2:#1f1f2c;
    --ink:#f4f4fa; --dim:#8a8a9d;
    --acid:#b6ff3c; --pink:#ff4fd8; --cyan:#45e6ff; --orange:#ff9f2e;
    --grad:linear-gradient(135deg,#b6ff3c,#45e6ff 55%,#ff4fd8);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior:none; user-select:none; -webkit-user-select:none;
    display:flex; flex-direction:column; min-height:100dvh;
  }
  /* ambient glow */
  body::before{
    content:""; position:fixed; inset:-40%; z-index:0; pointer-events:none;
    background:
      radial-gradient(38% 30% at 18% 8%, rgba(182,255,60,.13), transparent 70%),
      radial-gradient(34% 28% at 85% 16%, rgba(255,79,216,.12), transparent 70%),
      radial-gradient(40% 30% at 50% 100%, rgba(69,230,255,.10), transparent 70%);
  }
  header{
    position:sticky; top:0; z-index:10; padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
    background:rgba(14,14,19,.82); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .brandrow{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .logo{
    font-weight:900; font-size:26px; letter-spacing:-.5px; line-height:1;
    background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .logo .pillmark{display:inline-block; transform:translateY(2px); margin-left:4px}
  .streak{
    display:flex; align-items:center; gap:5px; background:var(--card2);
    border:1px solid rgba(255,255,255,.07); border-radius:999px; padding:6px 12px;
    font-weight:800; font-size:15px;
  }
  .streak .flame{font-size:17px; filter:drop-shadow(0 0 6px rgba(255,159,46,.8))}
  .streak.hot{animation:streakPulse 1.6s ease-in-out infinite}
  @keyframes streakPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,159,46,0)}50%{box-shadow:0 0 18px 2px rgba(255,159,46,.35)}}
  /* XP bar */
  .xprow{margin-top:10px; display:flex; align-items:center; gap:10px}
  .lvl{font-size:12px; font-weight:900; color:var(--acid); white-space:nowrap; letter-spacing:.5px}
  .xpbar{flex:1; height:8px; background:rgba(255,255,255,.08); border-radius:99px; overflow:hidden}
  .xpfill{height:100%; width:0%; background:var(--grad); border-radius:99px; transition:width .6s cubic-bezier(.2,.9,.2,1)}
  .dose{font-size:11px; color:var(--dim); font-weight:700; white-space:nowrap}
  /* progress today */
  .today{padding:14px 18px 4px; display:flex; align-items:center; gap:12px; position:relative; z-index:1}
  .ringwrap{width:52px; height:52px; position:relative; flex-shrink:0}
  .ringwrap svg{transform:rotate(-90deg)}
  .ringwrap .ringtxt{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900}
  .todaymsg{font-size:14px; color:var(--dim); font-weight:600; line-height:1.35}
  .todaymsg b{color:var(--ink)}
  /* list */
  main{flex:1; padding:8px 14px 140px; position:relative; z-index:1}
  .task{
    display:flex; align-items:center; gap:14px; background:var(--card);
    border:1px solid rgba(255,255,255,.06); border-radius:20px;
    padding:14px 14px; margin:10px 0;
    animation:taskIn .35s cubic-bezier(.2,.9,.3,1.2);
    transition:opacity .3s, transform .3s;
  }
  @keyframes taskIn{from{opacity:0; transform:translateY(14px) scale(.97)}to{opacity:1; transform:none}}
  .task.done{opacity:.45}
  .task.done .ttext{text-decoration:line-through; color:var(--dim)}
  .task.leaving{opacity:0; transform:translateX(60px) scale(.9)}
  .ttext{flex:1; font-size:16px; font-weight:600; line-height:1.3; word-break:break-word; user-select:text; -webkit-user-select:text}
  /* the tablet */
  .tablet{
    width:44px; height:44px; border-radius:50%; flex-shrink:0; cursor:pointer;
    border:none; position:relative;
    background:radial-gradient(circle at 32% 28%, #ffffff, #d9d9e6 45%, #9a9ab0 100%);
    box-shadow:0 3px 10px rgba(0,0,0,.5), inset 0 -3px 6px rgba(0,0,0,.18), inset 0 2px 3px rgba(255,255,255,.9);
    transition:transform .12s;
  }
  .tablet:active{transform:scale(.88)}
  .tablet::after{ /* engraved check */
    content:""; position:absolute; left:13px; top:15px; width:16px; height:9px;
    border-left:3.5px solid #8e8ea4; border-bottom:3.5px solid #8e8ea4;
    transform:rotate(-48deg); border-radius:2px;
    filter:drop-shadow(0 1px 0 rgba(255,255,255,.7));
  }
  .task.done .tablet{
    background:radial-gradient(circle at 32% 28%, #eaffd0, var(--acid) 55%, #6fae14 100%);
    box-shadow:0 0 18px rgba(182,255,60,.55), inset 0 -3px 6px rgba(0,0,0,.15), inset 0 2px 3px rgba(255,255,255,.8);
  }
  .task.done .tablet::after{border-color:#2c4d00}
  .del{background:none; border:none; color:var(--dim); font-size:20px; padding:8px; cursor:pointer; opacity:.6}
  .empty{
    text-align:center; color:var(--dim); margin-top:70px; font-size:15px; line-height:1.7; font-weight:600;
  }
  .empty .big{font-size:44px; display:block; margin-bottom:12px}
  /* composer */
  .composer{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    padding:12px 14px calc(env(safe-area-inset-bottom) + 14px);
    background:rgba(14,14,19,.9); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border-top:1px solid rgba(255,255,255,.06);
    display:flex; gap:10px;
  }
  .composer input{
    flex:1; background:var(--card2); border:1px solid rgba(255,255,255,.09);
    border-radius:16px; padding:15px 16px; color:var(--ink); font-size:16px; font-weight:600;
    outline:none;
  }
  .composer input:focus{border-color:rgba(182,255,60,.5)}
  .composer input::placeholder{color:var(--dim); font-weight:500}
  .addbtn{
    width:54px; height:54px; border-radius:16px; border:none; cursor:pointer;
    background:var(--grad); color:#0c0c10; font-size:30px; font-weight:900; line-height:1;
    box-shadow:0 4px 16px rgba(69,230,255,.35);
    transition:transform .12s;
  }
  .addbtn:active{transform:scale(.9)}
  /* floating +XP */
  .floatxp{
    position:fixed; z-index:60; font-weight:900; font-size:18px; pointer-events:none;
    color:var(--acid); text-shadow:0 0 12px rgba(182,255,60,.8);
    animation:floatUp 1s ease-out forwards;
  }
  @keyframes floatUp{from{opacity:1; transform:translateY(0) scale(1)}to{opacity:0; transform:translateY(-70px) scale(1.3)}}
  /* toast */
  .toast{
    position:fixed; top:calc(env(safe-area-inset-top) + 76px); left:50%; transform:translateX(-50%) translateY(-16px);
    background:var(--card2); border:1px solid rgba(255,255,255,.12); color:var(--ink);
    padding:11px 20px; border-radius:999px; font-weight:800; font-size:14px; z-index:70;
    opacity:0; transition:all .35s cubic-bezier(.2,.9,.3,1.2); pointer-events:none;
    box-shadow:0 8px 30px rgba(0,0,0,.5); white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  /* combo badge */
  .combo{
    position:fixed; top:calc(env(safe-area-inset-top) + 130px); right:16px; z-index:65;
    font-size:26px; font-weight:900; color:var(--pink);
    text-shadow:0 0 16px rgba(255,79,216,.9); pointer-events:none;
    opacity:0; transform:scale(.5);
  }
  .combo.pop{animation:comboPop .8s cubic-bezier(.2,.9,.3,1.4) forwards}
  @keyframes comboPop{0%{opacity:0; transform:scale(.5) rotate(-8deg)}25%{opacity:1; transform:scale(1.25) rotate(3deg)}60%{opacity:1; transform:scale(1)}100%{opacity:0; transform:scale(1.05) translateY(-10px)}}
  /* screen flash on complete */
  .flash{position:fixed; inset:0; z-index:50; pointer-events:none; opacity:0; background:radial-gradient(circle at var(--fx,50%) var(--fy,50%), rgba(182,255,60,.28), transparent 45%)}
  .flash.go{animation:flashGo .45s ease-out}
  @keyframes flashGo{0%{opacity:1}100%{opacity:0}}
  /* level-up overlay */
  .levelup{
    position:fixed; inset:0; z-index:80; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(10,10,14,.9); backdrop-filter:blur(8px); opacity:0; pointer-events:none; transition:opacity .3s;
  }
  .levelup.show{opacity:1; pointer-events:auto}
  .levelup .lu-title{font-size:40px; font-weight:900; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; animation:luZoom .6s cubic-bezier(.2,.9,.3,1.4)}
  .levelup .lu-sub{color:var(--dim); font-weight:700; margin-top:10px; font-size:15px}
  .levelup button{margin-top:26px; background:var(--grad); border:none; color:#0c0c10; font-weight:900; font-size:16px; padding:14px 34px; border-radius:999px; cursor:pointer}
  @keyframes luZoom{from{transform:scale(.4); opacity:0}to{transform:scale(1); opacity:1}}
  canvas#confetti{position:fixed; inset:0; z-index:75; pointer-events:none}
</style>
</head>
<body>
<header>
  <div class="brandrow">
    <div class="logo">ADDICT-DO<svg class="pillmark" width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#f0f0f7"/><path d="M6 10.4 8.8 13 14 7.4" stroke="#8e8ea4" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="streak" id="streakBadge"><span class="flame">🔥</span><span id="streakNum">0</span></div>
  </div>
  <div class="xprow">
    <div class="lvl" id="lvlLabel">LVL 1</div>
    <div class="xpbar"><div class="xpfill" id="xpFill"></div></div>
    <div class="dose" id="doseLabel">0 tablets</div>
  </div>
</header>
<div class="today">
  <div class="ringwrap">
    <svg width="52" height="52"><circle cx="26" cy="26" r="21" stroke="rgba(255,255,255,.08)" stroke-width="6" fill="none"/><circle id="ring" cx="26" cy="26" r="21" stroke="url(#rg)" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="132" stroke-dashoffset="132"/><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b6ff3c"/><stop offset=".55" stop-color="#45e6ff"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient></defs></svg>
    <div class="ringtxt" id="ringTxt">0%</div>
  </div>
  <div class="todaymsg" id="todayMsg">Loading your dose...</div>
</div>
<main id="list"></main>
<div class="composer">
  <input id="inp" type="text" placeholder="What needs doing?" enterkeyhint="done" autocomplete="off" maxlength="140">
  <button class="addbtn" id="addBtn" aria-label="Add task">+</button>
</div>
<div class="flash" id="flash"></div>
<div class="combo" id="combo"></div>
<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>
<div class="levelup" id="levelup">
  <div class="lu-title" id="luTitle">LEVEL 2</div>
  <div class="lu-sub">tolerance rising. keep dosing.</div>
  <button id="luClose">KEEP GOING</button>
</div>
<script>
(function(){
"use strict";
var LS_KEY='addictdo.v1';
var state=load();
function load(){
  try{var s=JSON.parse(localStorage.getItem(LS_KEY)); if(s&&s.tasks)return s;}catch(e){}
  return {tasks:[], xp:0, taken:0, streak:0, lastDoneDay:null, history:{}, combo:0, lastCompleteTs:0};
}
function save(){localStorage.setItem(LS_KEY,JSON.stringify(state));}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function dayKeyOffset(off){var d=new Date(Date.now()+off*864e5);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}

var list=document.getElementById('list'), inp=document.getElementById('inp');
var COMBO_WINDOW=9000;

function xpForLevel(l){return Math.round(60*Math.pow(l,1.6));}
function levelFromXp(xp){var l=1; while(xpForLevel(l)<=xp)l++; return l-1+1-1||1; }
function calcLevel(xp){var l=1; while(xpForLevel(l)<=xp)l++; return l;}

function render(){
  renderStats(); renderList();
}
function renderStats(){
  var lvl=calcLevel(state.xp);
  var base=lvl>1?xpForLevel(lvl-1):0;
  var next=xpForLevel(lvl);
  var pct=Math.min(100,Math.round(((state.xp-base)/(next-base))*100));
  document.getElementById('lvlLabel').textContent='LVL '+lvl;
  document.getElementById('xpFill').style.width=pct+'%';
  document.getElementById('doseLabel').textContent=state.taken+' tablet'+(state.taken===1?'':'s');
  document.getElementById('streakNum').textContent=state.streak;
  document.getElementById('streakBadge').classList.toggle('hot',state.streak>=3);
  // today ring
  var open=state.tasks.filter(function(t){return !t.done}).length;
  var done=state.tasks.filter(function(t){return t.done}).length;
  var total=open+done;
  var p=total?Math.round(done/total*100):0;
  document.getElementById('ring').style.strokeDashoffset=String(132-132*p/100);
  document.getElementById('ringTxt').textContent=p+'%';
  var msg;
  if(total===0)msg='Nothing on the list. <b>Add your first tablet.</b>';
  else if(open===0)msg='<b>All '+total+' done.</b> Clean system. Add more?';
  else msg='<b>'+open+'</b> tablet'+(open===1?'':'s')+' left to take today.';
  document.getElementById('todayMsg').innerHTML=msg;
}
function renderList(){
  list.innerHTML='';
  if(!state.tasks.length){
    list.innerHTML='<div class="empty"><span class="big">💊</span>Your prescription is empty.<br>Write something down, then take the tablet.</div>';
    return;
  }
  state.tasks.slice().sort(function(a,b){
    if(a.done!==b.done)return a.done?1:-1;
    return b.created-a.created;
  }).forEach(function(t){
    var el=document.createElement('div');
    el.className='task'+(t.done?' done':'');
    el.dataset.id=t.id;
    var tab=document.createElement('button');
    tab.className='tablet'; tab.setAttribute('aria-label',t.done?'Mark not done':'Mark done');
    tab.addEventListener('click',function(ev){toggle(t.id,ev);});
    var tx=document.createElement('div'); tx.className='ttext'; tx.textContent=t.text;
    var del=document.createElement('button'); del.className='del'; del.textContent='×'; del.setAttribute('aria-label','Delete');
    del.addEventListener('click',function(){removeTask(t.id,el);});
    el.appendChild(tab); el.appendChild(tx); el.appendChild(del);
    list.appendChild(el);
  });
}
function addTask(){
  var v=inp.value.trim();
  if(!v)return;
  state.tasks.push({id:Date.now()+''+Math.floor(Math.random()*1e4), text:v, done:false, created:Date.now()});
  inp.value=''; save(); render();
  vibrate(8); blip(520,0.05,'sine',0.12);
  inp.focus();
}
function toggle(id,ev){
  var t=null;
  for(var i=0;i<state.tasks.length;i++)if(state.tasks[i].id===id)t=state.tasks[i];
  if(!t)return;
  t.done=!t.done;
  if(t.done){
    var x=ev&&ev.clientX?ev.clientX:window.innerWidth/2;
    var y=ev&&ev.clientY?ev.clientY:window.innerHeight/2;
    var now=Date.now();
    if(now-state.lastCompleteTs<COMBO_WINDOW)state.combo++;else state.combo=1;
    state.lastCompleteTs=now;
    var gain=10*Math.min(state.combo,5);
    state.xp+=gain; state.taken++;
    updateStreak();
    var before=calcLevel(state.xp-gain), after=calcLevel(state.xp);
    save(); render();
    // dopamine stack
    floatXp(x,y,'+'+gain);
    flashAt(x,y);
    confettiBurst(x,y,state.combo>=3?90:40);
    vibrate([12,40,18]);
    pop();
    if(state.combo>=2)showCombo(state.combo);
    if(after>before)setTimeout(function(){levelUp(after);},450);
    var msgs=['tablet taken.','dopamine hit.','nice. another one.','craving satisfied.','you needed that.'];
    if(Math.random()<0.35)toastMsg(msgs[Math.floor(Math.random()*msgs.length)]);
    if(state.taken===1)toastMsg('first tablet. welcome to the habit.');
    if(state.taken===10)toastMsg('10 tablets. prescribed.');
    if(state.taken===50)toastMsg('50 tablets. clinically addicted.');
    if(state.taken===100)toastMsg('100 tablets. seek help (after one more).');
  }else{
    save(); render();
  }
}
function removeTask(id,el){
  el.classList.add('leaving');
  vibrate(6);
  setTimeout(function(){
    state.tasks=state.tasks.filter(function(t){return t.id!==id});
    save(); render();
  },260);
}
function updateStreak(){
  var tk=todayKey(), yk=dayKeyOffset(-1);
  if(state.lastDoneDay===tk)return;
  if(state.lastDoneDay===yk)state.streak++;
  else state.streak=1;
  state.lastDoneDay=tk;
  if(state.streak===3)toastMsg('🔥 3-day streak. the habit is forming.');
  if(state.streak===7)toastMsg('🔥 7 days. full-blown routine.');
  if(state.streak>1&&state.streak%14===0)toastMsg('🔥 '+state.streak+'-day streak. unstoppable.');
}
/* FX */
var toastT=null;
function toastMsg(m){
  var t=document.getElementById('toast');
  t.textContent=m; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('show')},2200);
}
function floatXp(x,y,txt){
  var f=document.createElement('div');
  f.className='floatxp'; f.textContent=txt;
  f.style.left=(x-14)+'px'; f.style.top=(y-20)+'px';
  document.body.appendChild(f);
  setTimeout(function(){f.remove()},1000);
}
function flashAt(x,y){
  var fl=document.getElementById('flash');
  fl.style.setProperty('--fx',(x/window.innerWidth*100)+'%');
  fl.style.setProperty('--fy',(y/window.innerHeight*100)+'%');
  fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
}
function showCombo(n){
  var c=document.getElementById('combo');
  c.textContent='COMBO ×'+Math.min(n,5);
  c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
}
function levelUp(lvl){
  var lu=document.getElementById('levelup');
  document.getElementById('luTitle').textContent='LEVEL '+lvl;
  lu.classList.add('show');
  confettiBurst(window.innerWidth/2,window.innerHeight/2,200);
  fanfare(); vibrate([30,60,30,60,80]);
}
document.getElementById('luClose').addEventListener('click',function(){
  document.getElementById('levelup').classList.remove('show');
});
/* confetti */
var cv=document.getElementById('confetti'), cx=cv.getContext('2d'), parts=[], rafOn=false;
function sizeCanvas(){cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; cx.scale(devicePixelRatio,devicePixelRatio);}
sizeCanvas(); addEventListener('resize',function(){cx.setTransform(1,0,0,1,0,0); sizeCanvas();});
function confettiBurst(x,y,n){
  var colors=['#b6ff3c','#45e6ff','#ff4fd8','#ff9f2e','#ffffff'];
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2, sp=3+Math.random()*8;
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,g:.28+Math.random()*.15,
      w:4+Math.random()*5,h:3+Math.random()*4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.35,
      c:colors[Math.floor(Math.random()*colors.length)],life:1});
  }
  if(!rafOn){rafOn=true; requestAnimationFrame(tick);}
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(function(p){return p.life>0;});
  parts.forEach(function(p){
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=.985; p.r+=p.vr; p.life-=.012;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r);
    cx.globalAlpha=Math.max(0,p.life);
    cx.fillStyle=p.c; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    cx.restore();
  });
  if(parts.length){requestAnimationFrame(tick);}else{rafOn=false; cx.clearRect(0,0,innerWidth,innerHeight);}
}
/* sound */
var AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function blip(freq,dur,type,vol,when){
  var a=ac(); if(!a)return;
  var o=a.createOscillator(), g=a.createGain(), t=a.currentTime+(when||0);
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(vol||0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
function pop(){
  var a=ac(); if(!a)return;
  var t=a.currentTime;
  var o=a.createOscillator(), g=a.createGain();
  o.type='sine'; o.frequency.setValueAtTime(680,t); o.frequency.exponentialRampToValueAtTime(1320,t+.09);
